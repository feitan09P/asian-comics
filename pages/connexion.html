<div class="fond-form">
  <div class="boite-form">
    <h2>Se <span>connecter</span></h2>
    <p>Bon retour parmi nous !</p>
    <div class="msg-erreur" id="msg-erreur"></div>
    <form onsubmit="gererConnexion(event)">
      <div class="groupe-input">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" placeholder="exemple@email.com" required>
      </div>
      <div class="groupe-input">
        <label for="mdp">Mot de passe</label>
        <input type="password" id="mdp" placeholder="Votre mot de passe" required>
      </div>
      <button type="submit" class="btn-submit">Se connecter →</button>
    </form>
    <p class="lien-form">
      Pas encore de compte ? <a href="./inscription.html">S'inscrire gratuitement</a>
    </p>
  </div>
