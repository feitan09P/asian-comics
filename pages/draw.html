<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fan Art Studio Pro - Asian Comics</title>
    <link rel="stylesheet" href="./style/style.css">
    <style>
        /* --- Styles spécifiques au Studio Pro --- */
        .studio-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 30px auto;
            max-width: 900px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        /* Organisation de la barre d'outils */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            width: 100%;
            margin-bottom: 20px;
            background: var(--bg-color);
            padding: 15px;
            border-radius: 8px;
            justify-content: center;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 10px;
            border-right: 2px solid var(--card-bg);
            padding-right: 20px;
        }
        
        .tool-group:last-child {
            border-right: none;
            padding-right: 0;
        }

        .tool-group label {
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--accent-color);
        }

        /* Boutons de la barre d'outils */
        .icon-btn {
            background: var(--primary-color);
            color: var(--text-color);
            border: 1px solid var(--secondary-color);
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .icon-btn:hover {
            background: var(--accent-color);
            color: white;
        }

        /* Bouton actif (pour savoir si on gomme ou on dessine) */
        .icon-btn.active {
            background: #00CED1;
            color: #1a1a2e;
            font-weight: bold;
            border-color: #00CED1;
        }

        /* Le Canvas */
        .canvas-container {
            position: relative;
            cursor: crosshair;
        }

        canvas {
            background-color: #ffffff;
            border: 3px solid var(--secondary-color);
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        /* Boutons d'action finaux */
        .action-footer {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        .launch-btn {
            padding: 12px 35px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .launch-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.6);
        }
    </style>
</head>
<body>
    <header>
        <h1>Asian Comics</h1>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="./pages/manga.html">Manga (Japon)</a></li>
                <li><a href="./pages/manhwa.html">Manhwa (Corée)</a></li>
                <li><a href="./pages/manhua.html">Manhua (Chine)</a></li>
                <li><a href="./pages/inscription.html">Inscription</a></li>
                <li><a href="./pages/apropos.html">À Propos</a></li>
                <li><button id="theme-toggle" class="theme-btn">☀️ Mode Clair</button></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="studio-wrapper">
            <h2 id="comic-title-display" style="color: #00CED1; margin-top: 0; text-align: center;">Studio de Fan Art</h2>
            
            <div class="toolbar">
                <div class="tool-group">
                    <label>Outils :</label>
                    <button id="brushBtn" class="icon-btn active">🖌️ Pinceau</button>
                    <button id="eraserBtn" class="icon-btn">🧹 Gomme</button>
                </div>
                
                <div class="tool-group">
                    <label>Apparence :</label>
                    <input type="color" id="colorPicker" value="#1a1a2e" title="Couleur">
                    <input type="range" id="brushSize" min="1" max="50" value="3" title="Taille (1-50)">
                </div>

                <div class="tool-group">
                    <label>Historique :</label>
                    <button id="undoBtn" class="icon-btn">↩️ Annuler</button>
                    <button id="redoBtn" class="icon-btn">↪️ Refaire</button>
                </div>

                <div class="tool-group">
                    <button id="clearBtn" class="icon-btn" style="color: #e74c3c;">🗑️ Vider</button>
                    <button id="downloadBtn" class="icon-btn" style="color: #2ecc71;">💾 Enregistrer (PC)</button>
                </div>
            </div>

            <div class="canvas-container">
                <canvas id="drawingBoard" width="800" height="450"></canvas>
            </div>

            <div class="action-footer">
                <button id="launchBtn" class="launch-btn">🚀 Lancer (Publier)</button>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('drawingBoard');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        // UI Elements
        const colorPicker = document.getElementById('colorPicker');
        const brushSize = document.getElementById('brushSize');
        const brushBtn = document.getElementById('brushBtn');
        const eraserBtn = document.getElementById('eraserBtn');
        
        // --- NOUVEAU : Initialisation propre du Canvas ---
        // Remplir le fond en blanc (sinon il est transparent lors de la sauvegarde)
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Variables d'état
        let isDrawing = false;
        let isEraser = false;
        let lastX = 0;
        let lastY = 0;

        // --- NOUVEAU : Système Undo/Redo (Tableaux d'états) ---
        let undoStack = [];
        let redoStack = [];

        // Sauvegarder l'état initial (la toile blanche)
        saveState();

        function saveState() {
            // Enregistre les pixels actuels du canvas
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            // On vide le redoStack dès qu'une nouvelle action est faite
            redoStack = []; 
        }

        // Configuration de base du pinceau
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        // --- Événements de Dessin ---
        function startDrawing(e) {
            isDrawing = true;
            lastX = e.offsetX;
            lastY = e.offsetY;
        }

        function draw(e) {
            if (!isDrawing) return;
            
            // Si c'est la gomme, on dessine en blanc. Sinon, on prend la couleur choisie.
            ctx.strokeStyle = isEraser ? "#ffffff" : colorPicker.value;
            ctx.lineWidth = brushSize.value;

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();

            lastX = e.offsetX;
            lastY = e.offsetY;
        }

        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
                saveState(); // On sauvegarde l'état à chaque fois qu'on lève le stylo !
            }
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // --- Gestion des Outils ---
        brushBtn.addEventListener('click', () => {
            isEraser = false;
            brushBtn.classList.add('active');
            eraserBtn.classList.remove('active');
        });

        eraserBtn.addEventListener('click', () => {
            isEraser = true;
            eraserBtn.classList.add('active');
            brushBtn.classList.remove('active');
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            if(confirm("Êtes-vous sûr de vouloir tout effacer ?")) {
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                saveState();
            }
        });

        // --- NOUVEAU : Logique Undo / Redo ---
        document.getElementById('undoBtn').addEventListener('click', () => {
            if (undoStack.length > 1) { // Toujours garder l'état blanc initial
                redoStack.push(undoStack.pop()); // Déplacer vers Redo
                let previousState = undoStack[undoStack.length - 1]; // Prendre le précédent
                ctx.putImageData(previousState, 0, 0); // Dessiner l'état précédent
            }
        });

        document.getElementById('redoBtn').addEventListener('click', () => {
            if (redoStack.length > 0) {
                let nextState = redoStack.pop(); // Récupérer du Redo
                undoStack.push(nextState); // Remettre dans Undo
                ctx.putImageData(nextState, 0, 0); // Dessiner
            }
        });

        // --- NOUVEAU : Téléchargement Local ---
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'Mon_FanArt.png';
            link.href = canvas.toDataURL('image/png'); // Convertit le canvas en image
            link.click(); // Simule un clic pour déclencher le téléchargement
        });

        // --- Lancement vers Base de données ---
        document.getElementById('launchBtn').addEventListener('click', () => {
            const imageDataUrl = canvas.toDataURL('image/png');
            alert("L'image est prête à être envoyée à Firebase (Base64 généré en arrière-plan) !");
            console.log("Image Data :", imageDataUrl);
        });
    </script>
</body>
</html>
